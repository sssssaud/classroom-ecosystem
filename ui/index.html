<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Ecosystem</title>
<style>
:root {
  --bg: #fbfbfa;
  --surface: #ffffff;
  --border: #e3e3df;
  --border-strong: #cfcfc9;
  --text: #161a17;
  --muted: #6c716d;
  --ok: #2f7d4f;
  --warn: #8d6100;
  --alert: #b3261e;
  --ok-wash: #f0f7f2;
  --warn-wash: #fcf6e8;
  --alert-wash: #fdf1f0;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101211;
    --surface: #171a18;
    --border: #272b28;
    --border-strong: #3a403c;
    --text: #e7eae8;
    --muted: #949a96;
    --ok: #5cb47f;
    --warn: #e0a534;
    --alert: #f2726a;
    --ok-wash: #14201a;
    --warn-wash: #211c10;
    --alert-wash: #231514;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

/* ---- header ---- */
.top {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.title { font-size: 13px; font-family: var(--mono); letter-spacing: .09em;
         text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 500; }
.freshness { font-family: var(--mono); font-size: 12px; color: var(--muted);
             display: flex; align-items: center; gap: 7px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.freshness[data-stale="true"] { color: var(--warn); }
.freshness[data-stale="true"] .pulse { background: var(--warn); }

/* ---- status banner ---- */
.status {
  display: flex; align-items: flex-start; gap: 12px;
  margin: 20px 0 24px; padding: 14px 16px;
  border: 1px solid var(--border); border-left-width: 3px; border-radius: 4px;
  background: var(--surface);
}
.status[data-level="ok"]    { border-left-color: var(--ok);    background: var(--ok-wash); }
.status[data-level="warn"]  { border-left-color: var(--warn);  background: var(--warn-wash); }
.status[data-level="alert"] { border-left-color: var(--alert); background: var(--alert-wash); }
.status[data-level="fault"] { border-left-color: var(--muted); }
.status[data-level="boot"]  { border-left-color: var(--muted); }
.status svg { flex: none; margin-top: 2px; }
.status-text { min-width: 0; }
.status-label {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 1px;
}
.status-msg { font-size: 17px; font-weight: 500; }

/* ---- reading tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 1px;
         background: var(--border); border: 1px solid var(--border); border-radius: 4px;
         overflow: hidden; }
.tile { background: var(--surface); padding: 14px 15px 15px; }
.tile-label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
              text-transform: uppercase; color: var(--muted); }
.tile-value { margin-top: 7px; display: flex; align-items: baseline; gap: 4px; }
.num { font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums;
       letter-spacing: -.02em; line-height: 1.1; }
.unit { font-size: 13px; color: var(--muted); }
.tile[data-level="warn"] .num { color: var(--warn); }
.tile[data-level="alert"] .num { color: var(--alert); }
.tile[data-level="offline"] .num { color: var(--muted); font-size: 19px; font-weight: 400; }
.tile-note { font-family: var(--mono); font-size: 10.5px; color: var(--muted);
             letter-spacing: .04em; text-transform: uppercase; margin-top: 3px;
             min-height: 1.4em; }

/* band track: where the value sits inside its comfort band */
.band { margin-top: 11px; height: 3px; background: var(--border); border-radius: 2px;
        position: relative; }
.band-in { position: absolute; top: 0; bottom: 0; background: var(--border-strong);
           border-radius: 2px; }
.band-mark { position: absolute; top: -3px; width: 2px; height: 9px;
             background: var(--text); border-radius: 1px; }
.tile[data-level="warn"] .band-mark { background: var(--warn); }
.tile[data-level="alert"] .band-mark { background: var(--alert); }
.band-scale { display: flex; justify-content: space-between; margin-top: 5px;
              font-family: var(--mono); font-size: 10px; color: var(--muted); }

/* ---- charts ---- */
.section-head { display: flex; align-items: baseline; justify-content: space-between;
                margin: 32px 0 12px; }
.section-head h2 { font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
                   text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0; }
.span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px;
          background: var(--border); border: 1px solid var(--border); border-radius: 4px;
          overflow: hidden; }
.chart { background: var(--surface); padding: 13px 15px 10px; }
.chart:last-child { grid-column: 1 / -1; }
@media (max-width: 620px) { .charts { grid-template-columns: 1fr; } }
.chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.chart-name { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
              text-transform: uppercase; color: var(--muted); }
.chart-now { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.chart svg { display: block; width: 100%; height: 56px; margin-top: 8px; overflow: visible; }
.chart-axis { display: flex; justify-content: space-between; margin-top: 5px;
              font-family: var(--mono); font-size: 10px; color: var(--muted); }
.spark { fill: none; stroke: var(--text); stroke-width: 1.25;
         stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.overband { fill: var(--alert); opacity: .07; }
.empty { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 18px 0; }

/* ---- actions ---- */
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
button {
  font: inherit; font-size: 13px; color: var(--text); background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: 4px; padding: 8px 14px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--text); }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
button:disabled { color: var(--muted); cursor: not-allowed; }
.hint { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .pulse { animation: blip 2s ease-in-out infinite; }
  @keyframes blip { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 class="title">Classroom Ecosystem</h1>
    <div class="freshness" id="freshness">
      <span class="pulse" aria-hidden="true"></span><span id="fresh-text">connecting</span>
    </div>
  </header>

  <div class="status" id="status" data-level="boot" role="status" aria-live="polite">
    <span id="status-icon" aria-hidden="true"></span>
    <span class="status-text">
      <span class="status-label" id="status-label">Starting</span>
      <span class="status-msg" id="status-msg">Waiting for the first reading&hellip;</span>
    </span>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="section-head">
    <h2>Last 3 hours</h2>
    <span class="span" id="span"></span>
  </div>
  <div class="charts" id="charts"></div>

  <div class="actions">
    <button id="mute" type="button">Mute buzzer for 10 min</button>
    <button id="calibrate" type="button">Set clean-air baseline</button>
  </div>
  <p class="hint" id="hint"></p>

</div>

<script>
"use strict";

// Mock-server passthrough: open ?s=alert to force a scenario while designing.
const SCENARIO = new URLSearchParams(location.search).get("s");
const qs = SCENARIO ? "?s=" + encodeURIComponent(SCENARIO) : "";

const FIELDS = [
  { key: "temperature_c", label: "Temperature", unit: "°C", dp: 1 },
  { key: "humidity_pct",  label: "Humidity",    unit: "%",       dp: 0 },
  { key: "pressure_hpa",  label: "Pressure",    unit: "hPa",     dp: 0 },
  { key: "air_index",     label: "Air index",   unit: "× base", dp: 2 },
  { key: "noise_db",      label: "Noise",       unit: "dB",      dp: 0 },
];

const ICONS = {
  // Distinct shapes, so status never depends on colour alone.
  ok:    '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="var(--ok)" stroke-width="1.6"/><path d="M5.6 9.2l2.3 2.3 4.5-4.7" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn:  '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2.3L16.4 15H1.6z" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 7v3.4" stroke="var(--warn)" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="12.6" r="1" fill="var(--warn)"/></svg>',
  alert: '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M6.2 1.6h5.6l4.6 4.6v5.6l-4.6 4.6H6.2L1.6 11.8V6.2z" fill="none" stroke="var(--alert)" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 5.2v4.4" stroke="var(--alert)" stroke-width="1.9" stroke-linecap="round"/><circle cx="9" cy="12.4" r="1.05" fill="var(--alert)"/></svg>',
  fault: '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="var(--muted)" stroke-width="1.6"/><path d="M4.4 4.4l9.2 9.2" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/></svg>',
  boot:  '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="3 3"/></svg>',
};

const LABELS = { ok: "Normal", warn: "Warning", alert: "Alert", fault: "Sensor fault", boot: "Starting" };

const el = (id) => document.getElementById(id);
const fmt = (v, dp) => v === null || v === undefined ? "—" : Number(v).toFixed(dp);

let lastOk = 0;

/* ---------------- tiles ---------------- */

function renderTiles(readings) {
  el("tiles").innerHTML = FIELDS.map((f) => {
    const r = readings[f.key] || {};
    const level = r.level || "offline";
    const offline = level === "offline";
    // Out-of-range must be readable without seeing colour.
    const note = r.note || (level === "ok" ? "" : rangeNote(r));
    return `<div class="tile" data-level="${level}">
      <div class="tile-label">${f.label}</div>
      <div class="tile-value">
        <span class="num">${offline ? "offline" : fmt(r.value, f.dp)}</span>
        ${offline ? "" : `<span class="unit">${f.unit}</span>`}
      </div>
      <div class="tile-note">${note ? esc(note) : ""}</div>
      ${band(r, f)}
    </div>`;
  }).join("");
}

function rangeNote(r) {
  if (!r.band || r.value === null || r.value === undefined) return "out of range";
  return r.value > r.band[1] ? "above range" : r.value < r.band[0] ? "below range" : "out of range";
}

// Draws the comfort band with a marker for the current value. The scale is
// padded 20% beyond the band so an out-of-range value still lands on the track.
function band(r, f) {
  if (!r.band || r.value === null || r.value === undefined) return "";
  const [lo, hi] = r.band;
  const pad = (hi - lo) * 0.2 || 1;
  const min = lo - pad, max = hi + pad;
  const pct = (v) => Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
  return `<div class="band" role="img" aria-label="${fmt(r.value, f.dp)} ${f.unit}, comfortable range ${lo} to ${hi}">
      <div class="band-in" style="left:${pct(lo)}%;right:${100 - pct(hi)}%"></div>
      <div class="band-mark" style="left:calc(${pct(r.value)}% - 1px)"></div>
    </div>
    <div class="band-scale"><span>${lo}</span><span>${hi}</span></div>`;
}

/* ---------------- charts ---------------- */

function renderCharts(hist) {
  const step = hist.interval_s || 10;
  const series = hist.series || {};
  el("span").textContent = spanLabel(Object.values(series)[0], step);

  el("charts").innerHTML = FIELDS.map((f) => {
    const pts = series[f.key] || [];
    const clean = pts.filter((v) => v !== null && v !== undefined);
    if (clean.length < 2) {
      return `<div class="chart"><div class="chart-head"><span class="chart-name">${f.label}</span></div>
              <div class="empty">not enough history yet</div></div>`;
    }
    const last = pts[pts.length - 1];
    return `<div class="chart">
      <div class="chart-head">
        <span class="chart-name">${f.label}</span>
        <span class="chart-now">${fmt(last, f.dp)} ${f.unit}</span>
      </div>
      ${spark(pts, clean)}
      <div class="chart-axis">
        <span>${spanLabel(pts, step)} ago</span>
        <span>${fmt(Math.min(...clean), f.dp)}–${fmt(Math.max(...clean), f.dp)} ${f.unit}</span>
        <span>now</span>
      </div>
    </div>`;
  }).join("");
}

// Hand-rolled sparkline. A chart library is ~200 KB the ESP32 would have to
// serve with no internet available; this is 15 lines.
// ponytail: no y-axis ticks, the tile above carries the number. Add ticks only
// if reading the exact shape ever matters more than the trend.
function spark(pts, clean) {
  const W = 300, H = 56;
  let min = Math.min(...clean), max = Math.max(...clean);
  if (max - min < 1e-6) { min -= 0.5; max += 0.5; }
  const pad = (max - min) * 0.12;
  min -= pad; max += pad;
  const x = (i) => (i / (pts.length - 1)) * W;
  const y = (v) => H - ((v - min) / (max - min)) * H;

  // Break the line across gaps rather than drawing through missing readings.
  let d = "", pen = false;
  pts.forEach((v, i) => {
    if (v === null || v === undefined) { pen = false; return; }
    d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
    pen = true;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
            <path class="spark" d="${d.trim()}"/>
          </svg>`;
}

function spanLabel(pts, step) {
  if (!pts || !pts.length) return "";
  const mins = Math.round((pts.length * step) / 60);
  return mins >= 60 ? `${(mins / 60).toFixed(mins % 60 ? 1 : 0)} h` : `${mins} min`;
}

/* ---------------- status + freshness ---------------- */

function renderStatus(s) {
  const level = ICONS[s.status] ? s.status : "boot";
  el("status").dataset.level = level;
  el("status-icon").innerHTML = ICONS[level];
  el("status-label").textContent = LABELS[level];
  el("status-msg").textContent = s.message || "";

  const muted = s.muted_until_s > 0;
  el("mute").disabled = muted;
  el("mute").textContent = muted
    ? `Muted — ${Math.ceil(s.muted_until_s / 60)} min left`
    : "Mute buzzer for 10 min";

  const hints = [];
  if (!s.gas_baseline_set) hints.push("Air index hidden: clean-air baseline not set.");
  else if (!s.burn_in_complete) hints.push("Gas sensor still stabilising — treat the air index as rough.");
  if (muted) hints.push("Buzzer silenced. The alert itself is still active.");
  el("hint").textContent = hints.join(" ");
}

function tick() {
  const age = Math.round((Date.now() - lastOk) / 1000);
  if (!lastOk) return;
  const stale = age > 6;
  el("freshness").dataset.stale = stale;
  el("fresh-text").textContent = stale ? `stale — ${age}s since update` : `updated ${age}s ago`;
}

/* ---------------- polling ---------------- */

async function poll() {
  try {
    const s = await (await fetch("/api/state" + qs, { cache: "no-store" })).json();
    renderStatus(s);
    renderTiles(s.readings || {});
    lastOk = Date.now();
    tick();
  } catch (e) {
    el("freshness").dataset.stale = "true";
    el("fresh-text").textContent = "no connection";
  }
}

async function loadHistory() {
  try {
    renderCharts(await (await fetch("/api/history" + qs, { cache: "no-store" })).json());
  } catch (e) { /* charts stay empty; live values still work */ }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function post(path, btn) {
  const was = btn.textContent;
  btn.disabled = true; btn.textContent = "Working…";
  try { await fetch(path + qs, { method: "POST" }); } catch (e) { /* poll reports reality */ }
  btn.textContent = was; btn.disabled = false;
  poll();
}

el("mute").addEventListener("click", (e) => post("/api/mute", e.currentTarget));
el("calibrate").addEventListener("click", (e) => post("/api/calibrate", e.currentTarget));

poll();
loadHistory();
setInterval(poll, 2000);
setInterval(tick, 1000);
setInterval(loadHistory, 30000);
</script>
</body>
</html>
